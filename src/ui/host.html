<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src ws:">
  <title>平板智联</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="host.js"></script>
</head>
<body class="desktop">
  <main class="shell">
    <header class="page-header">
      <div>
        <h1>平板智联</h1>
        <p>把 Windows 屏幕传到平板浏览器</p>
      </div>
      <span class="status" id="status" role="status">正在读取设备…</span>
    </header>

    <div class="controls-grid">
      <section class="panel source-panel" aria-labelledby="source-heading">
        <header class="panel-heading">
          <h2 id="source-heading">屏幕与网络</h2>
          <button class="quiet" id="refresh" type="button">刷新设备</button>
        </header>
        <label for="source">共享屏幕</label>
        <select id="source" disabled></select>
        <figure class="preview" aria-label="所选屏幕预览">
          <img id="source-preview" alt="所选屏幕" hidden>
        </figure>
        <label for="network">局域网地址</label>
        <select id="network" disabled></select>
        <div class="actions">
          <button class="primary" id="start" type="button" disabled>开始共享</button>
          <button class="danger" id="stop" type="button" hidden>停止共享</button>
        </div>
      </section>

      <section class="panel connect-panel" aria-labelledby="connect-heading">
        <h2 id="connect-heading">连接平板</h2>
        <div id="instructions" class="instructions">
          <ol>
            <li>让电脑和 MatePad 接入同一个局域网。</li>
            <li>点击开始共享，用平板扫描二维码或打开连接链接。</li>
            <li>在平板上请求观看，再在电脑上允许连接。</li>
          </ol>
        </div>
        <div id="share-details" hidden>
          <img id="qr" class="qr" width="154" height="154" alt="用平板扫描此二维码">
          <label for="share-url">也可在平板浏览器打开链接</label>
          <div class="link-row">
            <input id="share-url" type="text" readonly spellcheck="false">
            <button class="quiet" id="copy" type="button">复制链接</button>
          </div>
        </div>
        <div class="request" id="request" hidden>
          <p>有设备正在请求观看所选屏幕。</p>
          <div class="request-actions">
            <button class="quiet" id="reject" type="button">拒绝</button>
            <button class="primary" id="approve" type="button">允许连接</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
