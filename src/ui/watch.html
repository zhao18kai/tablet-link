<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>平板智联 · 接收画面</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="watch.js"></script>
</head>
<body class="viewer">
  <main id="stage" class="stage">
    <header id="viewer-bar" class="viewer-bar">
      <h1>平板智联</h1>
      <div class="viewer-actions">
        <span id="touch-hint" hidden>双指滑动滚动，双指轻触显示全屏控件</span>
        <select class="quiet" id="fit" aria-label="画面显示方式" hidden>
          <option value="fill">拉伸铺满（保留四边）</option>
          <option value="contain" selected>等比完整（可能留边）</option>
          <option value="cover">等比铺满（裁边）</option>
        </select>
        <select class="quiet" id="receiver-buffer" aria-label="视频缓冲" hidden>
          <option value="0" selected>缓冲 0 ms</option>
          <option value="auto">自动缓冲</option>
          <option value="20">缓冲 20 ms</option>
        </select>
        <button class="quiet" id="fullscreen" type="button" disabled>全屏</button>
        <button class="quiet" id="leave" type="button" disabled>断开</button>
      </div>
    </header>
    <div class="screen">
      <video autoplay muted playsinline aria-label="来自 Windows 电脑的屏幕画面"></video>
      <canvas id="rotation-frame" aria-hidden="true" hidden></canvas>
      <button id="viewer-surface" type="button" aria-label="显示全屏控件" aria-controls="viewer-bar" aria-expanded="false" hidden></button>
      <div class="stream-hud" id="stream-hud" aria-label="串流状态" hidden>
        <div class="stream-summary">
          <div class="stream-tags">
            <span id="stream-state">串流中</span>
            <span class="stream-tag stream-link" id="stream-connection"></span>
            <span class="stream-tag" id="stream-codec" hidden></span>
          </div>
          <div class="stream-readings">
            <span class="stream-reading"><span>接收</span><span id="stream-received-fps">— FPS</span></span>
            <span class="stream-reading"><span>解码</span><span id="stream-fps">— FPS</span></span>
            <span class="stream-reading"><span>呈现</span><span id="stream-presented-fps">— FPS</span></span>
            <span class="stream-reading"><span>码率</span><span id="stream-bitrate">— Mb/s</span></span>
            <span class="stream-reading"><span>往返</span><span id="stream-rtt">— ms</span></span>
            <span class="stream-reading"><span>缓冲</span><span id="stream-buffer-delay">— ms</span></span>
            <span id="stream-resolution">— × —</span>
          </div>
        </div>
        <div class="stream-trend">
          <span>近 30 秒呈现帧率</span>
          <canvas id="stream-history" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="viewer-prompt" id="viewer-prompt">
        <p id="status" role="status">发起请求后，请在电脑上允许连接。</p>
        <button id="connect" class="primary" type="button">请求观看</button>
      </div>
    </div>
  </main>
</body>
</html>
